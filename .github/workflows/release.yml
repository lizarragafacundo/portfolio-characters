name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm provenance: the attestation is signed with a short-lived
  # OIDC token from this workflow, which is what proves the tarball was built
  # from this commit in this repository.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      # The same gate CI runs. Nothing publishes unless main is green.
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run validate:persona
      - run: pnpm run build

      # If there are pending changesets, this opens/updates a "Version
      # Packages" PR (package.json bump + CHANGELOG.md) and does not publish.
      # If main already has an un-published version bump — i.e. that PR was
      # just merged — this publishes instead and does not open a PR.
      - name: Create Release PR or publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm publish --access public --provenance --no-git-checks
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        if: steps.changesets.outputs.published == 'true'
        run: |
          pkgs='${{ steps.changesets.outputs.publishedPackages }}'
          version=$(echo "$pkgs" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].version")
          gh release create "v$version" --generate-notes --target main
        env:
          GH_TOKEN: ${{ github.token }}
